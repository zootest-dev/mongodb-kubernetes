name: Publish existing Zoo operator image

on:
  workflow_dispatch:
  push:
    branches:
      - chore/publish-existing-operator-image
    paths:
      - .github/workflows/publish-existing-operator-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Install image copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Publish the existing operator image under Zootest
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_IMAGE: ghcr.io/realtimetodie/mongodb-kubernetes@sha256:8136cc33617ef3d317bcc958e8dd3f5e42476c41676ed09e65ff07bc06ddf09e
          DESTINATION_IMAGE: ghcr.io/zootest-dev/mongodb-kubernetes:fix-connection-string-secret-namespace
        run: |
          set -euo pipefail
          registry_auth_file="$RUNNER_TEMP/ghcr-auth.json"
          trap 'rm -f "$registry_auth_file"' EXIT
          printf '%s' "$GHCR_TOKEN" |
            skopeo login --authfile "$registry_auth_file" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --src-no-creds --dest-authfile "$registry_auth_file" \
            "docker://$SOURCE_IMAGE" "docker://$DESTINATION_IMAGE"
          skopeo inspect --authfile "$registry_auth_file" --format '{{ .Digest }}' "docker://$DESTINATION_IMAGE"
